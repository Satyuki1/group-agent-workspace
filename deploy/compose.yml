name: group-agent

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "3"}
  networks: [group-agent]

services:
  gateway:
    <<: *common
    environment:
      GROUP_AGENT_HOST: ${GROUP_AGENT_HOST:?required}
    image: docker.m.daocloud.io/library/caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports: ["${GROUP_AGENT_HOST:?required}:18443:18443", "${GROUP_AGENT_HOST:?required}:18444:18444"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/group-agent/data/caddy:/data
    mem_limit: 256m
    cpus: 0.5
  postgres:
    <<: *common
    image: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    command: [postgres, -c, shared_buffers=512MB, -c, max_wal_size=512MB, -c, checkpoint_timeout=15min, -c, checkpoint_completion_target=0.9, -c, wal_compression=on]
    environment:
      POSTGRES_USER: buzz
      POSTGRES_DB: buzz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
    volumes:
      - /mnt/group-agent/data/postgres:/var/lib/postgresql/data
      - /mnt/group-agent/data/wal-fast/pg_wal:/var/lib/postgresql/data/pg_wal
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    <<: *common
    image: redis@sha256:ee64a64eaab618d88051c3ade8f6352d11531fcf79d9a4818b9b183d8c1d18ba
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    # Redis is disposable coordination state; PostgreSQL owns durable work.
    # Rates, presence and leases restart empty; message and task truth is in PG.
    command: [sh, -c, 'exec redis-server --appendonly no --save "" --requirepass "$$REDIS_PASSWORD" --maxmemory 192mb --maxmemory-policy noeviction']
    volumes: [/mnt/group-agent/data/redis:/data]
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    <<: *common
    image: docker.m.daocloud.io/pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY:?required}
    volumes: [/mnt/group-agent/data/objects:/data]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: minio/mc@sha256:c0d345a438dcac5677c1158e4ac46637069b67b3cc38e7b04c08cf93bdee4a62
    networks: [group-agent]
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?required}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?required}
    entrypoint: [/bin/sh, -euc]
    command:
      - 'mc alias set local http://minio:9000 "$$BUZZ_S3_ACCESS_KEY" "$$BUZZ_S3_SECRET_KEY" >/dev/null; mc mb --ignore-existing local/buzz-media; mc anonymous set none local/buzz-media'
    depends_on:
      minio: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.25
  relay:
    <<: *common
    image: ghcr.io/block/buzz@sha256:49522c1eb18dabaf65fc2b9508a8906eb3dfb631a1d95e7ac90b11b9b51a81bc
    env_file: /mnt/group-agent/secrets/relay.env
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:${POSTGRES_PASSWORD}@postgres:5432/buzz
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
    volumes: [/mnt/group-agent/data/git:/data/git]
    ports: ["127.0.0.1:18445:3000", "127.0.0.1:18446:8080"]
    mem_limit: 1g
    cpus: 1
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/_readiness]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
  webhost:
    <<: *common
    networks: [group-agent, group-agent-spaces]
    image: node@sha256:173f125896c3b47ddf056734c7ea789d04595a6a08769a8f78e0df642781fb66
    user: "996:995"
    working_dir: /workspace
    env_file: /mnt/group-agent/secrets/model.env
    command: [node, --import, tsx, apps/server/src/index.mjs]
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${GROUP_AGENT_HOST:?required}:18443
      RELAY_ORIGIN: https://${GROUP_AGENT_HOST:?required}:18444
      DATABASE_URL: postgres://group_agent:${APP_DB_PASSWORD}@postgres:5432/group_agent
      NODE_EXTRA_CA_CERTS: /run/group-agent/ca.crt
    volumes:
      - /mnt/group-agent/releases/current:/workspace:ro
      - /mnt/group-agent/data/host:/data/host
      - /mnt/group-agent/secrets/vault.key:/run/group-agent/secrets/vault.key:ro
      - /mnt/group-agent/secrets/owner.key:/run/group-agent/secrets/owner.key:ro
      - /mnt/group-agent/data/caddy/caddy/pki/authorities/local/root.crt:/run/group-agent/ca.crt:ro
    mem_limit: 1g
    cpus: 1
    depends_on:
      postgres: {condition: service_healthy}
      relay: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  group-agent-spaces:
    name: group-agent-spaces
    external: true
  group-agent:
    name: group-agent
    ipam:
      config:
        - subnet: 10.253.76.0/24
