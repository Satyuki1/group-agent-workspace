services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: team
      POSTGRES_USER: team
      POSTGRES_PASSWORD: ${IM_DB_PASSWORD:?Set IM_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team -d team"]
      interval: 3s
      timeout: 3s
      retries: 15
  im:
    build:
      context: ..
      dockerfile: team/Dockerfile
      args:
        NPM_REGISTRY: ${IM_NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      IM_DATABASE_URL: postgres://team:${IM_DB_PASSWORD:?Set IM_DB_PASSWORD}@db:5432/team
      IM_ORIGIN: ${IM_ORIGIN:-http://127.0.0.1:3090}
      IM_PERSONAL_WORKSPACE_OWNER: ${IM_PERSONAL_WORKSPACE_OWNER:-}
      IM_PERSONAL_WORKSPACE_ORIGIN: ${IM_PERSONAL_WORKSPACE_ORIGIN:-}
      IM_RUNNER_SECRET: ${IM_RUNNER_SECRET:?Set IM_RUNNER_SECRET}
    volumes:
      - attachments:/data
    ports:
      - "127.0.0.1:3090:3090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3090/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
  runner:
    profiles: [agent]
    build:
      context: .
      dockerfile: runner/supervisor.Dockerfile
    restart: unless-stopped
    environment:
      IM_SERVER_URL: http://im:3090
      IM_RUNNER_SECRET: ${IM_RUNNER_SECRET:?Set IM_RUNNER_SECRET}
      IM_WORKER_IMAGE: dsbot-team-worker:local
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      IM_ROUTER_API_KEY: ${IM_ROUTER_API_KEY:-}
      IM_ROUTER_BASE_URL: ${IM_ROUTER_BASE_URL:-https://api.deepseek.com/v1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      im:
        condition: service_healthy
  worker-image:
    profiles: [build-worker]
    image: dsbot-team-worker:local
    build: runner
volumes:
  postgres:
  attachments:
